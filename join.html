<!DOCTYPE html>
<html lang="fr" data-product="musique">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Rejoins une partie</title>

  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="join.css?v=5" />
</head>
<body>

  <main class="app">

    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>

    <section class="app-main join-main">

      <h1 class="title-h1 join-title">Rejoins une partie</h1>
      <p class="join-lead">Entre le code que ton pote t'a partagé.</p>

      <input type="text"
             id="pin-input"
             class="input join-pin-input"
             placeholder="000000"
             maxlength="6"
             inputmode="numeric"
             autocomplete="off" />
      <p class="join-error" id="pin-error" hidden></p>

    </section>

    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--primary" id="btn-validate-pin" disabled>Valider</button>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=5"></script>
  <script src="join.js?v=5"></script>
</body>
</html>
