<!DOCTYPE html>
<html lang="fr" data-product="musique">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Rejoins une partie</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="join.css" />
</head>
<body>

  <main class="app">

    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>

    <section class="app-main join-main">

      <h1 class="title-h1 join-title">Rejoins une partie</h1>
      <p class="join-lead">Entre le code que ton pote t'a partagé.</p>

      <!-- Étape 1 : code PIN -->
      <div class="join-step" id="step-pin">
        <input type="text"
               id="pin-input"
               class="input join-pin-input"
               placeholder="000000"
               maxlength="6"
               inputmode="numeric"
               autocomplete="off" />
        <p class="join-error" id="pin-error" hidden></p>

        <!-- Aperçu de la partie une fois le PIN trouvé -->
        <div class="join-preview" id="join-preview" hidden>
          <p class="join-preview__label">Cette partie contient :</p>
          <ul class="join-preview__themes" id="join-preview-themes"></ul>
        </div>
      </div>

      <!-- Étape 2 : pseudo + avatar -->
      <div class="join-step" id="step-identity" hidden>
        <h2 class="title-h2 join-subtitle">C'est quoi ton p'tit nom ?</h2>
        <input type="text"
               id="pseudo-input"
               class="input"
               placeholder="Ton prénom"
               maxlength="20" />
        <p class="join-error" id="pseudo-error" hidden></p>

        <h2 class="title-h3 join-subtitle">Choisis un avatar</h2>
        <ul class="avatar-grid" id="avatar-picker"></ul>
      </div>

    </section>

    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--primary" id="btn-validate-pin" disabled>Valider</button>
        <button type="button" class="btn btn--primary" id="btn-go" hidden disabled>C'est parti&nbsp;!</button>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="join.js"></script>
</body>
</html>
