<!DOCTYPE html>
<html lang="fr" data-product="musique">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Bravo !</title>

  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="stylesheet" href="invite.css?v=4" />
</head>
<body>

  <main class="app">

    <!-- Header : icône maison + logo -->
    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-home" aria-label="Accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>

    <section class="app-main invite-main">

      <!-- Avatar + emoji clap -->
      <div class="invite-avatar">
        <div class="invite-avatar__main" id="my-avatar"></div>
        <div class="invite-avatar__emoji">👏</div>
      </div>

      <!-- Titre BRAVO [PSEUDO] ! -->
      <h1 class="title-display invite-title">
        BRAVO <span id="invite-pseudo">…</span>&nbsp;!
      </h1>

      <p class="invite-lead">
        Tu n'as plus qu'à attendre tes potes.<br>
        Si tu ne les as pas encore invités,<br>
        c'est le moment de le faire&nbsp;!
      </p>

      <!-- PIN gros et bleu + bouton copier -->
      <div class="pin-block">
        <span class="pin-block__code" id="pin-code">000000</span>
        <button type="button" class="pin-block__copy" id="btn-copy" aria-label="Copier le code PIN">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>

      <!-- Bouton partage -->
      <button type="button" class="btn btn--primary btn--full invite-share" id="btn-share">
        Je partage le lien
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>

      <!-- Lien retour homepage -->
      <button type="button" class="invite-back" id="btn-back-home">
        Revenir à la homepage
      </button>

    </section>

  </main>

  <!-- Toast de confirmation -->
  <div class="toast" id="toast" hidden>
    <span id="toast-text">Copié !</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=4"></script>
  <script src="invite.js?v=4"></script>
</body>
</html>
