<!DOCTYPE html>
<html lang="fr" data-product="musique">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Crée une partie</title>

  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="stylesheet" href="create.css?v=4" />
</head>
<body>

  <main class="app">

    <!-- Header -->
    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>


    <!-- ============= PAGE UNIQUE : pseudo + avatar + thèmes ============= -->
    <section class="app-main">
      <div class="create-content">

        <!-- Bloc 1 : Prénom -->
        <h1 class="title-h1 create-title">C'est quoi ton p'tit nom&nbsp;?</h1>
        <input type="text"
               id="pseudo-input"
               class="input"
               placeholder="Ton prénom"
               maxlength="20"
               autocomplete="given-name" />


        <!-- Bloc 2 : Avatar -->
        <h2 class="title-h3 create-subtitle">Choisis un avatar</h2>
        <ul class="avatar-grid" id="avatar-picker"></ul>


        <!-- Bloc 3 : Thèmes (titre dynamique selon prénom saisi en live) -->
        <h2 class="title-h2 create-subtitle create-subtitle--themes" id="themes-title">
          OK, on a choisi quelques thèmes pour toi, change les si tu veux&nbsp;!
        </h2>
        <p class="create-lead">Tu devras choisir une chanson pour chacun de ces thèmes.</p>

        <ul class="themes-list" id="themes-list"></ul>

        <button type="button" class="btn btn--tertiary themes-add" id="btn-add-theme">
          + Créer un thème personnalisé
        </button>

      </div>
    </section>


    <!-- ============= OVERLAY pleine page : création d'un thème custom ============= -->
    <div class="custom-overlay" id="custom-overlay" hidden>
      <header class="app-header custom-overlay__header">
        <button type="button" class="icon-btn" id="btn-back-custom" aria-label="Retour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
        <span class="icon-btn-spacer"></span>
      </header>

      <section class="app-main">
        <div class="create-content">
          <h1 class="title-h1 create-title">Crée ton thème</h1>
          <p class="create-lead">Imagine un thème original pour faire deviner tes potes !</p>

          <div class="custom-theme-field">
            <label for="custom-theme-input" class="custom-theme-label">Musique…</label>
            <input type="text"
                   id="custom-theme-input"
                   class="input"
                   placeholder="pour jouer à Wooo"
                   maxlength="40" />
            <p class="custom-theme-hint" id="custom-theme-hint">0 / 40</p>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        <div class="app-footer__row">
          <button type="button" class="btn btn--primary" id="btn-add-custom" disabled>
            Je l'ajoute
          </button>
        </div>
      </footer>
    </div>


    <!-- Footer : un seul bouton de validation finale -->
    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--primary" id="btn-launch" disabled>
          C'est parti avec <span id="theme-count">0</span> thèmes&nbsp;!
        </button>
      </div>
    </footer>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=4"></script>
  <script src="create.js?v=4"></script>
</body>
</html>
