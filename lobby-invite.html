<!DOCTYPE html>
<html lang="fr" data-product="musique">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Salle d'attente</title>

  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="lobby.css?v=6" />
</head>
<body>

  <main class="app">

    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>

    <section class="app-main lobby-main">

      <!-- Rappel du code PIN -->
      <div class="lobby-pin">
        <p class="lobby-pin__label">Code de la partie</p>
        <p class="lobby-pin__code" id="lobby-pin-code">000000</p>
      </div>

      <!-- Tes potes -->
      <div class="lobby-section">
        <h2 class="title-h2 lobby-section__title">Tes potes</h2>
        <p class="lobby-section__lead">Tu les connais toutes et tous j'espère&nbsp;!</p>
        <ul class="lobby-players" id="lobby-players" aria-live="polite"></ul>
      </div>

      <!-- Les thèmes -->
      <div class="lobby-section">
        <h2 class="title-h2 lobby-section__title">Les thèmes</h2>
        <p class="lobby-section__lead">
          Pour chaque thème, tu vas entendre les chansons choisies par tes potes et tu devras retrouver qui a choisi quoi&nbsp;!
        </p>
        <ul class="lobby-themes" id="lobby-themes"></ul>
      </div>

      <!-- Message d'état -->
      <p class="lobby-message" id="lobby-message"></p>

    </section>

    <!-- Footer : SEUL bouton Voter, désactivé tant que créateur n'a pas lancé -->
    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--primary" id="btn-voter" disabled>
          Voter&nbsp;!
        </button>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=6"></script>
  <script src="lobby-invite.js?v=6"></script>
</body>
</html>
