<!DOCTYPE html>
<html lang="fr" data-product="musique">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Trop tard !</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="classement.css" />
</head>
<body>

  <main class="app">

    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>

    <section class="app-main classement-main">

      <h1 class="title-h1 classement-title">Tu arrives trop tard&nbsp;!</h1>
      <p class="classement-lead">La partie est déjà lancée. Voici le classement en cours :</p>

      <ul class="classement-list" id="classement-list"></ul>
      <p class="classement-loading" id="classement-loading">Chargement…</p>

    </section>

    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--secondary" id="btn-join-other">Rejoindre une autre partie</button>
        <button type="button" class="btn btn--primary" id="btn-create">Créer une partie</button>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="late.js"></script>
</body>
</html>
