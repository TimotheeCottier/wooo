<!DOCTYPE html>
<html lang="fr" data-product="cine">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo Ciné — Tu confirmes ?</title>

  <link rel="stylesheet" href="styles.css?v=7" />
  <link rel="stylesheet" href="confirm.css?v=7" />
  <link rel="stylesheet" href="confirm-cine.css?v=7" />
</head>
<body>

  <main class="app">

    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <div class="progress-dots" id="progress-dots"></div>
      <button type="button" class="icon-btn" id="btn-close" aria-label="Quitter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <section class="app-main confirm-main">

      <h1 class="title-h1 confirm-theme" id="confirm-theme">CHARGEMENT…</h1>

      <!-- Poster du film/série -->
      <div class="confirm-poster">
        <img id="poster-img" src="" alt="" />
      </div>

      <!-- Bloc info film + année + réalisateur -->
      <div class="confirm-song">
        <div class="confirm-song__info">
          <p class="confirm-song__title" id="film-title"></p>
          <p class="confirm-song__artist" id="film-meta"></p>
        </div>
      </div>

    </section>

    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--primary" id="btn-confirm">Je confirme</button>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=7"></script>
  <script src="confirm-cine.js?v=7"></script>
</body>
</html>
