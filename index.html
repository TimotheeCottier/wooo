<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo — Choisis ton univers</title>

  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="hub.css?v=6" />
</head>
<body class="hub-body">

  <main class="hub">

    <!-- Logo en surimpression -->
    <header class="hub-header">
      <img src="assets/logo.svg" alt="Wooo" class="hub-header__logo" />
    </header>

    <!-- Split : 2 produits -->
    <div class="hub-split">

      <!-- Wooo Musique -->
      <a href="index-musique.html" class="hub-card hub-card--musique" data-product="musique">
        <div class="hub-card__mosaic" id="mosaic-musique" aria-hidden="true"></div>
        <div class="hub-card__overlay"></div>
        <div class="hub-card__content">
          <h2 class="hub-card__title">Wooo<br/>Musique</h2>
          <p class="hub-card__lead">Devine ce qu'écoutent tes potes&nbsp;!</p>
          <span class="hub-card__cta">Jouer →</span>
        </div>
      </a>

      <!-- Wooo Ciné & Séries -->
      <a href="index-cine.html" class="hub-card hub-card--cine" data-product="cine">
        <div class="hub-card__mosaic" id="mosaic-cine" aria-hidden="true"></div>
        <div class="hub-card__overlay"></div>
        <div class="hub-card__content">
          <h2 class="hub-card__title">Wooo<br/>Ciné&nbsp;&amp;&nbsp;Séries</h2>
          <p class="hub-card__lead">Devine ce que regardent tes potes&nbsp;!</p>
          <span class="hub-card__cta">Jouer →</span>
        </div>
      </a>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=6"></script>
  <script src="hub.js?v=6"></script>
</body>
</html>
