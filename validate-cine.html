<!DOCTYPE html>
<html lang="fr" data-product="cine">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F5" />
  <title>Wooo Ciné — Plus qu'à valider</title>

  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="validate.css?v=6" />
  <link rel="stylesheet" href="search-cine.css?v=6" />
</head>
<body>

  <main class="app">

    <header class="app-header">
      <button type="button" class="icon-btn" id="btn-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <img src="assets/logo.svg" alt="Wooo" class="app-header__logo" />
      <span class="icon-btn-spacer"></span>
    </header>

    <section class="app-main validate-main">

      <div class="validate-avatar">
        <div class="validate-avatar__main" id="my-avatar"></div>
        <div class="validate-avatar__emoji">😎</div>
      </div>

      <h1 class="title-h1 validate-title">Plus qu'à valider&nbsp;!</h1>
      <p class="validate-lead">Tu peux vérifier tes choix et les modifier si tu veux. N'oublie pas de valider&nbsp;!</p>

      <ul class="validate-themes" id="validate-themes"></ul>

      <p class="validate-loading" id="validate-loading">Chargement…</p>

    </section>

    <footer class="app-footer">
      <div class="app-footer__row">
        <button type="button" class="btn btn--primary" id="btn-validate">Je valide&nbsp;!</button>
      </div>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=6"></script>
  <script src="validate-cine.js?v=6"></script>
</body>
</html>
